<style>

/* ===== 共通：土台 ===== */
:root {
  /* 色 */
  --ink-2: #f1e7d6; --muted: #d4c6b0; --soft: #bda98e; --faint: #8c7b66;
  --accent: #c9a46c; --accent-hover: #dcb985;
  --on-accent: #211913;
  --paper: #211913; --paper-hi: #2a2018; --paper-lo: #1a130e;
  --err: #ef9a86;
  --ink-08: rgba(241,231,214,.08);
  --ink-16: rgba(241,231,214,.16);
  --ink-24: rgba(241,231,214,.24);
  --accent-08: rgba(201,164,108,.08);
  --accent-16: rgba(201,164,108,.16);
  --accent-48: rgba(201,164,108,.48);
  --shade-16: rgba(0,0,0,.16); --shade-24: rgba(0,0,0,.24); --shade-32: rgba(0,0,0,.32);
  --card: rgba(46,36,28,.96); --card-64: rgba(46,36,28,.64);
  --paper-64: rgba(33,25,19,.64);

  /* 間隔 */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-6: 24px; --sp-8: 32px;
  --sp-12: 48px; --sp-16: 64px; --sp-24: 96px;

  --gap-tight: var(--sp-1);
  --gap-item: var(--sp-2);
  --gap-list: var(--sp-3);
  --gap-head: var(--sp-4);
  --gap-block: var(--sp-6);
  --gap-section: var(--sp-8);
  --page-group: var(--sp-16);
  --page-section: var(--sp-24);

  /* 枠の内側 */
  --pad-part: var(--sp-3) var(--sp-4);
  --pad-box: var(--sp-6);
  --pad-tag: var(--sp-1) var(--sp-3);
  --pad-choice: var(--sp-2) var(--sp-4);

  /* 横の位置 */
  --page-pad: var(--sp-4);
  --card-w: 480px;
  --card-pad-x: var(--sp-8);
  --card-pad-y: var(--sp-12);

  /* 部品の大きさ */
  --size-control: var(--sp-16);
  --day-col: var(--sp-16);
  --arrow: var(--sp-8);
  --logo-h: 50px;
  --logo-foot: 48px;

  /* 線・角丸・影 */
  --bw: 1px; --focus-w: 2px;
  --r-sm: 4px; --r-md: 16px; --r-xl: 24px; --r-pill: 999px;
  --shadow-card: 0 var(--sp-6) var(--sp-16) var(--shade-32), 0 var(--sp-1) var(--sp-3) var(--shade-24);

  /* 文字 */
  --font-sans: "Inter", "Zen Kaku Gothic New", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-heading: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --fw-regular: 400;
  --fw-ui: 500;
  --fw-heading: 500;
  --fw-heading-sub: 600;
  --fs-sm: 14px;
  --fs-md: 16px;
  --fs-lg: 20px;
  --lh-none: 1;
  --lh-ui: 1.4;
  --lh-text: 1.8;

  /* 動き */
  --dur-press: .1s; --dur-base: .2s; --dur-enter: .8s;
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --lift: -2px; --press: .97; --enter-y: var(--sp-4);
  --dim: .6;
  --disabled: .4;
  --dock-delay: .6s;
  --bar-glow: 4s;

  /* 背景 */
  --bg-page:
    radial-gradient(circle at 8% 8%, var(--accent-16), transparent 40%),
    radial-gradient(circle at 92% 92%, var(--accent-16), transparent 32%),
    linear-gradient(145deg, var(--paper-hi) 0%, var(--paper-lo) 100%);

  color-scheme: dark;
}
@media (max-width: 480px) { :root { --page-pad: var(--sp-2); --card-pad-x: var(--sp-4); --card-pad-y: var(--sp-8); } }

/* ---------- 土台 ---------- */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; background: var(--paper); }
body {
  font-family: var(--font-sans); font-weight: var(--fw-regular); font-size: var(--fs-md); line-height: var(--lh-text);
  color: var(--ink-2); background: var(--bg-page);
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
  min-height: 100svh; display: grid; place-items: start center;
  padding: calc(env(safe-area-inset-top, 0px) + var(--page-pad)) var(--page-pad) calc(env(safe-area-inset-bottom, 0px) + var(--page-pad));
}
h1, h2, h3 { font-family: var(--font-heading); font-weight: var(--fw-heading); line-height: var(--lh-ui); }
main p { color: var(--muted); }
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: var(--focus-w) solid var(--accent); outline-offset: var(--focus-w); }
section[id], article[id] { scroll-margin-top: var(--page-group); }

/* ---------- カード ---------- */
.card {
  position: relative; width: min(100%, var(--card-w));
  min-height: calc(100svh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - var(--page-pad) * 2);
  display: flex; flex-direction: column; padding: var(--card-pad-y) var(--card-pad-x); overflow: hidden;
  border: var(--bw) solid var(--ink-08); border-radius: var(--r-xl); background: var(--card); box-shadow: var(--shadow-card);
  animation: enter var(--dur-enter) var(--ease-out) both;
}
@keyframes enter { from { opacity: 0; transform: translateY(var(--enter-y)); } to { opacity: 1; transform: none; } }

/* ---------- ヘッダー ---------- */
.head { position: relative; margin: calc(var(--card-pad-y) * -1) calc(var(--card-pad-x) * -1) 0; padding: var(--card-pad-y) var(--card-pad-x); background: var(--accent-08); box-shadow: inset 0 calc(var(--bw) * -1) 0 var(--accent-48); }
.head::after { content: ""; position: absolute; left: 0; right: 0; bottom: calc(var(--bw) * -3); height: var(--bw); background: var(--accent-48); }
.head .wrap { display: grid; grid-template-columns: minmax(0, 1fr); justify-items: start; }

/* ---------- ロゴ ---------- */
.brand { display: block; text-decoration: none; transition: opacity var(--dur-base) var(--ease-out); }
.brand img { display: block; width: auto; height: var(--logo-h); }
.site-foot .brand img { height: var(--logo-foot); }

/* ---------- ナビ ---------- */
.nav { display: flex; flex-wrap: wrap; gap: var(--gap-head); margin-top: var(--gap-section); padding: var(--gap-head) 0; border-top: var(--bw) dashed var(--ink-24); border-bottom: var(--bw) dashed var(--ink-24); }
.nav a { padding: var(--gap-item) 0; margin: calc(var(--gap-item) * -1) 0; font-size: var(--fs-sm); line-height: var(--lh-none); text-decoration: none; white-space: nowrap; color: var(--muted); transition: color var(--dur-base) var(--ease-out); }
@media (hover: hover) { .brand:hover { opacity: var(--dim); } .nav a:hover { color: var(--ink-2); } }

/* ---------- 見出し ---------- */
h1, h2 { font-size: var(--fs-lg); margin-bottom: var(--gap-section); }
.page-title h1::after, .sec h2:not(.name)::after, .band h2::after { content: ""; display: block; width: 56px; height: 7px; margin-top: var(--gap-list); background: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2256%22 height=%227%22 viewBox=%220 0 56 7%22 fill=%22none%22 stroke=%22%23c9a46c%22%3E%3Cpath d=%22M0 3.5h22M34 3.5h22%22/%3E%3Cpath d=%22M28 .5l3 3-3 3-3-3z%22/%3E%3C/svg%3E") no-repeat; }
h3 { font-size: var(--fs-md); font-weight: var(--fw-heading-sub); }

/* ---------- ページの並び ---------- */
.sec { padding-top: var(--page-section); }

/* ---------- 線で区切った行 ---------- */
.rows { list-style: none; border-top: var(--bw) dashed var(--ink-24); }
.rows > * { padding: var(--gap-head) 0; border-bottom: var(--bw) dashed var(--ink-24); }

/* ---------- 画面下のメニュー ---------- */
.dock {
  position: fixed; left: 50%; bottom: 0; z-index: 10;
  width: min(100% - (var(--page-pad) + var(--bw)) * 2, var(--card-w) - var(--bw) * 2); translate: -50% 0;
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  padding: 0 var(--card-pad-x) env(safe-area-inset-bottom, 0px);
  background: linear-gradient(var(--card-64), var(--card));
  -webkit-backdrop-filter: blur(var(--sp-3)); backdrop-filter: blur(var(--sp-3));
  transition: translate var(--dur-base) var(--ease-out), opacity var(--dur-base) var(--ease-out);
  animation: dock-in var(--dur-enter) var(--ease-out) var(--dock-delay) backwards;
}
@keyframes dock-in { from { translate: -50% 100%; opacity: 0; } }
.dock::after { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--accent-16); opacity: 0; pointer-events: none; animation: bar-glow var(--bar-glow) ease-in-out infinite; }
@keyframes bar-glow { 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .dock::after { animation: none !important; } }
.dock::before { content: ""; position: absolute; top: 0; left: var(--card-pad-x); right: var(--card-pad-x); border-top: var(--bw) dashed var(--ink-24); }
.dock.hide { translate: -50% 100%; opacity: 0; pointer-events: none; }
.dock a {
  position: relative; display: grid; place-content: center;
  min-height: var(--size-control); font-weight: var(--fw-ui); line-height: var(--lh-ui); text-decoration: none; white-space: nowrap;
  transition: opacity var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out);
}
.dock a + a::before { content: ""; position: absolute; left: 0; top: 50%; height: var(--sp-6); margin-top: calc(var(--sp-6) / -2); border-left: var(--bw) dashed var(--ink-24); }
.dock a:focus-visible { outline-offset: calc(var(--focus-w) * -1); border-radius: var(--r-md); }
.dock a:active { transform: scale(var(--press)); transition-duration: var(--dur-press); }
@media (hover: hover) { .dock a:hover { opacity: var(--dim); } }

/* ---------- フッター ---------- */
.site-foot { margin-top: auto; padding-top: calc(var(--page-section) + var(--foot-nudge, 0px)); }
.foot-body { position: relative; margin: 0 calc(var(--card-pad-x) * -1) calc(var(--card-pad-y) * -1); padding: var(--card-pad-y) var(--card-pad-x); background: var(--accent-08); box-shadow: inset 0 var(--bw) 0 var(--accent-48); }
.foot-body::before { content: ""; position: absolute; left: 0; right: 0; top: calc(var(--bw) * -3); height: var(--bw); background: var(--accent-48); }
.foot-row { display: flex; align-items: center; justify-content: space-between; gap: var(--gap-item); }
/* ---------- ページの先頭へ ---------- */
.to-top { flex: 0 0 var(--arrow); width: var(--arrow); height: var(--arrow); display: grid; place-items: center; border: var(--bw) solid transparent; border-radius: 50%; background: var(--accent-16); line-height: var(--lh-none); text-decoration: none; color: var(--muted); transition: background-color var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out); }
@media (hover: hover) { .to-top:hover { background: var(--accent); color: var(--on-accent); } }
.footer { margin-top: var(--gap-section); font-size: var(--fs-sm); line-height: var(--lh-none); color: var(--faint); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
/* ===== 共通：土台ここまで ===== */

/* ===== 共通：三本線のメニュー ===== */
.menu-btn {
  position: fixed; z-index: 10;
  top: calc(env(safe-area-inset-top, 0px) + var(--page-pad) + var(--card-pad-y) + var(--menu-bar, 0px));
  right: calc(max(var(--page-pad), (100% - var(--card-w)) / 2) + var(--card-pad-x));
  width: var(--arrow); height: var(--arrow); display: grid; place-items: center; padding: 0; cursor: pointer;
  border: var(--bw) solid transparent; border-radius: 50%; background: var(--paper-64); color: var(--muted);
  transition: top var(--dur-base) var(--ease-out), background-color var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out);
}
.menu-btn svg { display: block; }
@media (hover: hover) { .menu-btn:hover { background: var(--accent); color: var(--on-accent); } }
.has-pop .menu-btn { visibility: hidden; }
html.has-menu { overflow: hidden; }
.menu {
  position: fixed; inset: 0 0 auto; margin: 0 auto; padding: 0; border: 0;
  width: min(100% - (var(--page-pad) + var(--bw)) * 2, var(--card-w) - var(--bw) * 2); max-width: none; max-height: 100%;
  overflow: auto; overscroll-behavior: contain;
  border-radius: 0 0 var(--r-md) var(--r-md); background: var(--card); color: var(--ink-2); box-shadow: var(--shadow-card);
}
.menu::backdrop { background: var(--paper-64); }
@media (prefers-reduced-motion: no-preference) { .menu[open] { animation: menu-in var(--dur-base) var(--ease-out); } }
@keyframes menu-in { from { translate: 0 -100%; opacity: 0; } }
.menu-body { padding: calc(env(safe-area-inset-top, 0px) + var(--page-pad) + var(--card-pad-y)) var(--card-pad-x) var(--card-pad-y); }
.menu-close {
  position: relative; display: block; width: var(--arrow); height: var(--arrow); margin-left: auto; padding: 0; cursor: pointer;
  border: var(--bw) solid transparent; border-radius: 50%; background: var(--accent-08); color: var(--muted);
}
.menu-close::before, .menu-close::after { content: ""; position: absolute; left: 50%; top: 50%; width: var(--sp-3); height: var(--bw); margin: calc(var(--bw) / -2) 0 0 calc(var(--sp-3) / -2); background: currentColor; rotate: 45deg; }
.menu-close::after { rotate: -45deg; }
@media (hover: hover) { .menu-close:hover { background: var(--accent); color: var(--on-accent); } }
.menu-list { list-style: none; margin-top: var(--gap-head); border-top: var(--bw) dashed var(--ink-24); }
.menu-list + .menu-list { margin-top: var(--gap-section); }
.menu-list li { border-bottom: var(--bw) dashed var(--ink-24); }
.menu-list a, .menu-list li > span { display: flex; align-items: baseline; justify-content: space-between; gap: var(--gap-item); padding: var(--gap-list) 0; line-height: var(--lh-ui); text-decoration: none; color: var(--ink-2); transition: color var(--dur-base) var(--ease-out); }
.menu-list [aria-current] { color: var(--faint); }
.menu-soon { font-size: var(--fs-sm); color: var(--soft); }
@media (hover: hover) { .menu-list a:hover { color: var(--accent); } }
/* ===== 共通：三本線のメニューここまで ===== */

/* ===== 共通：写真の枠 ===== */
.ph {
  --ph-h: 280px;
  display: flex; gap: var(--gap-item); height: var(--ph-h);
  margin-inline: calc(var(--card-pad-x) * -1);
  overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; contain: inline-size;
  scrollbar-width: none;
}
.ph::-webkit-scrollbar { display: none; }
.ph img {
  flex: 0 0 auto; width: auto; height: 100%; max-width: calc(100% - var(--sp-12));
  object-fit: cover;
  filter: sepia(.2) saturate(.85) brightness(.85);
}
.ph img:only-child { width: 100%; max-width: none; }
.ph-box { position: relative; }
.ph-btn {
  position: absolute; top: 50%; z-index: 1; width: var(--arrow); height: var(--arrow); margin-top: calc(var(--arrow) / -2);
  display: none; place-items: center; padding: 0; cursor: pointer;
  border: var(--bw) solid transparent; border-radius: 50%; background: var(--paper-64);
  font: inherit; line-height: var(--lh-none); color: var(--muted);
  transition: opacity var(--dur-base) var(--ease-out), background-color var(--dur-base) var(--ease-out);
}
.ph-btn.prev { left: 0; } .ph-btn.next { right: 0; }
.ph-btn[disabled] { opacity: 0; pointer-events: none; }
@media (hover: hover) and (pointer: fine) { .ph-btn { display: grid; } .ph-btn:hover { background: var(--accent); color: var(--on-accent); } }
/* ===== 共通：写真の枠ここまで ===== */

/* ===== 共通：ラベル ===== */
.tags { list-style: none; display: flex; flex-wrap: wrap; gap: var(--gap-item); }
.tags li { padding: var(--pad-tag); border: var(--bw) solid var(--accent-48); border-radius: var(--r-sm); background: var(--accent-08); font-size: var(--fs-sm); line-height: var(--lh-ui); white-space: nowrap; color: var(--muted); }
/* ===== 共通：ラベルここまで ===== */
/* ===== 共通：題と副題 ===== */
.name { display: grid; gap: var(--gap-item); }
.name small { display: flex; align-items: center; gap: var(--gap-item); font-family: var(--font-heading); font-size: var(--fs-sm); font-weight: var(--fw-regular); line-height: var(--lh-ui); color: var(--soft); }
.name small::before { content: ""; flex: 0 0 var(--sp-4); border-top: var(--bw) solid var(--accent-48); }
/* ===== 共通：題と副題ここまで ===== */

/* ===== 共通：ページの題 ===== */
.page-title { padding-top: var(--page-group); }
.lead { font-family: var(--font-heading); font-size: var(--fs-md); font-weight: var(--fw-heading-sub); line-height: var(--lh-ui); color: var(--ink-2); }
.lead + p { margin-top: var(--gap-head); }
/* ===== 共通：ページの題ここまで ===== */

/* ===== このページだけ：スタッフ紹介 ===== */
/* ---------- ページの並び ---------- */

/* ---------- スタッフ1人分 ---------- */
.staff-list { display: grid; gap: var(--page-group); margin-top: var(--page-group); }
.staff .ph { height: auto; container-type: inline-size; }
.staff .ph img { height: var(--ph-h); }
.staff .ph img:only-child { width: 100%; height: auto; max-height: calc(100cqi * 4 / 3); }
.staff .name { margin-bottom: 0; }
.staff .ph + .name { margin-top: var(--gap-section); }
.staff .tags, .staff .comment { margin-top: var(--gap-head); }
.staff .comment { white-space: pre-line; }
.staff .profile { margin-top: var(--gap-item); font-size: var(--fs-sm); line-height: var(--lh-ui); color: var(--soft); }
.staff .profile span + span { margin-left: var(--gap-item); padding-left: var(--gap-item); border-left: var(--bw) dashed var(--ink-24); }

/* ---------- 読み込みの状態 ---------- */
.staff-box[data-state="loading"] .staff-list { min-height: 280px; }
.staff-note { margin-top: var(--page-group); color: var(--muted); }
.staff-note a { text-decoration-color: var(--ink-24); text-underline-offset: var(--sp-1); }
.staff-box:not([data-state="error"]) .staff-error, .staff-box:not([data-state="empty"]) .staff-empty { display: none; }
.staff-list > *, .staff-note { animation: fade var(--dur-base) var(--ease-out) both; }
@keyframes fade { from { opacity: 0; } }
/* ===== このページだけここまで ===== */
</style>
</head>

<script>
/* ===== 共通：三本線のメニュー ===== */
(() => {
  const btn = document.getElementById("menu-btn");
  const menu = document.getElementById("site-menu");
  if (!btn || !menu) return;
  const root = document.documentElement;
  if (typeof menu.showModal !== "function") { btn.hidden = true; return; }
  btn.addEventListener("click", () => { menu.showModal(); root.classList.add("has-menu"); btn.setAttribute("aria-expanded", "true"); });
  menu.addEventListener("close", () => { root.classList.remove("has-menu"); btn.setAttribute("aria-expanded", "false"); btn.focus(); });
  menu.querySelector(".menu-close").addEventListener("click", () => menu.close());
  menu.addEventListener("click", (e) => { if (e.target === menu) menu.close(); });
  menu.querySelectorAll("a[data-soon]").forEach((a) => {
    const note = a.querySelector(".menu-soon");
    if (!note) return;
    let timer;
    a.addEventListener("click", (e) => {
      e.preventDefault();
      note.textContent = "準備中です";
      clearTimeout(timer);
      timer = setTimeout(() => { note.textContent = ""; }, 3000);
    });
  });
  const bar = document.getElementById("status");
  if (bar) {
    const place = () => {
      const on = bar.isConnected && bar.classList.contains("on") && !bar.classList.contains("hide");
      root.style.setProperty("--menu-bar", on ? bar.offsetHeight + "px" : "0px");
    };
    new MutationObserver(place).observe(bar, { attributes: true, attributeFilter: ["class"] });
    if (window.ResizeObserver) new ResizeObserver(place).observe(bar);
    place();
  }
})();
/* ===== 共通：三本線のメニューここまで ===== */
/* ===== 共通：画面下のメニュー ===== */
(() => {
  const dock = document.getElementById("dock");
  const until = dock && document.querySelector(dock.dataset.until);
  if (!until) return;
  let ticking = false;
  const update = () => {
    ticking = false;
    const hide = until.getBoundingClientRect().top < innerHeight;
    dock.classList.toggle("hide", hide);
    dock.inert = hide;
  };
  const onScroll = () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } };
  addEventListener("scroll", onScroll, { passive: true });
  addEventListener("resize", onScroll);
  update();
})();
/* ===== 共通：画面下のメニューここまで ===== */

/* ===== 共通：フッターの位置 ===== */
(() => {
  const card = document.querySelector(".card");
  const body = document.querySelector(".foot-body");
  if (!card || !body || !window.ResizeObserver) return;
  const foot = body.parentElement;
  const snap = () => {
    const r = window.devicePixelRatio || 1;
    const now = parseFloat(foot.style.getPropertyValue("--foot-nudge")) || 0;
    const y = (body.getBoundingClientRect().top - card.getBoundingClientRect().top - now) * r;
    const next = ((Math.ceil(y - .001) - y) / r).toFixed(3) + "px";
    if (foot.style.getPropertyValue("--foot-nudge") !== next) foot.style.setProperty("--foot-nudge", next);
  };
  new ResizeObserver(snap).observe(card);
  addEventListener("resize", snap);
})();
/* ===== 共通：フッターの位置ここまで ===== */
</script>
<script>
/* ===== 共通：写真の送りボタン ===== */
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
const phButtons = (root) => root.querySelectorAll(".ph").forEach((ph) => {
  if (ph.dataset.btn || ph.children.length < 2) return;
  ph.dataset.btn = "1";
  const box = document.createElement("div");
  box.className = "ph-box";
  ph.before(box);
  box.append(ph);
  const make = (cls, label, txt, dir) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "ph-btn " + cls;
    b.setAttribute("aria-label", label);
    b.textContent = txt;
    b.addEventListener("click", () => ph.scrollBy({ left: dir * ph.clientWidth * .8, behavior: reduce.matches ? "auto" : "smooth" }));
    box.append(b);
    return b;
  };
  const prev = make("prev", "前の写真", "←", -1);
  const next = make("next", "次の写真", "→", 1);
  const update = () => {
    prev.disabled = ph.scrollLeft <= 1;
    next.disabled = ph.scrollLeft >= ph.scrollWidth - ph.clientWidth - 1;
  };
  ph.addEventListener("scroll", update, { passive: true });
  addEventListener("resize", update);
  ph.querySelectorAll("img").forEach((img) => img.addEventListener("load", update));
  update();
});
phButtons(document);
window.phButtons = phButtons;
/* ===== 共通：写真の送りボタンここまで ===== */
</script>
<script>
/* ---------- スタッフ紹介 ---------- */
(() => {
  const ENDPOINT = "https://script.google.com/macros/s/AKfycbymfb-1zaPmaks9vQk_cmBJg2P-YCuKZFA8bLx5pZIbiTHPu_sgtex6ePEetcoQa9Bh/exec?type=staff";
  const KEY = "momizo-staff-2";
  const COURSES = ["ボディ", "ヘッド", "フット", "フル"];
  const box = document.getElementById("staff");
  const list = document.getElementById("staff-list");
  const txt = (v) => String(v == null ? "" : v).replace(/\r\n?/g, "\n").trim();
  const photos = (v) => Array.isArray(v) ? v : String(v || "").split(/[\s,、]+/).filter((id) => /^[\w-]{20,}$/.test(id)).map((id) => ({ src: "https://drive.google.com/thumbnail?id=" + id + "&sz=w960" }));
  const courses = (v) => { const s = String(v || ""); return COURSES.filter((c) => s.includes(c)).map((c) => c + "コース"); };
  const career = (v) => {
    const y = parseInt(String(v || "").replace(/[０-９]/g, (d) => String.fromCharCode(d.charCodeAt(0) - 0xFEE0)), 10);
    const now = new Date().getFullYear();
    if (!(y >= 1950 && y <= now)) return "";
    return now - y < 1 ? "施術歴1年未満" : "施術歴" + (now - y) + "年";
  };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const card = (p) => {
    const name = txt(p.name);
    const a = el("article", "staff");
    const ph = photos(p.photo);
    if (ph.length) {
      const f = el("div", "ph");
      ph.forEach((x, i) => {
        const img = el("img");
        img.alt = x.alt || name + "の写真" + (ph.length > 1 ? "（" + (i + 1) + "）" : "");
        img.width = 960; img.height = 560; img.loading = "lazy"; img.decoding = "async"; img.referrerPolicy = "no-referrer";
        img.addEventListener("error", () => { img.remove(); if (!f.children.length) f.remove(); });
        img.src = x.src;
        f.append(img);
      });
      a.append(f);
    }
    const h = el("h2", "name", name);
    if (txt(p.role)) h.append(el("small", null, txt(p.role)));
    a.append(h);
    const prof = [txt(p.gender), career(p.since)].filter(Boolean);
    if (prof.length) { const r = el("p", "profile"); prof.forEach((x) => r.append(el("span", null, x))); a.append(r); }
    const tags = courses(p.courses);
    if (tags.length) { const t = el("ul", "tags"); tags.forEach((x) => t.append(el("li", null, x))); a.append(t); }
    if (txt(p.comment)) a.append(el("p", "comment", txt(p.comment)));
    return a;
  };
  const show = (people, state) => {
    const ok = (people || []).filter((p) => p && txt(p.name));
    list.replaceChildren(...ok.map(card));
    box.dataset.state = ok.length ? state : "empty";
    if (window.phButtons) window.phButtons(list);
  };
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
  if (Array.isArray(cached) && cached.length) show(cached, "list");
  const ctrl = new AbortController();
  setTimeout(() => ctrl.abort(), 8000);
  fetch(ENDPOINT, { signal: ctrl.signal })
    .then((r) => r.json())
    .then((d) => {
      if (d && d.ok && Array.isArray(d.staff)) {
        try { localStorage.setItem(KEY, JSON.stringify(d.staff)); } catch (e) {}
        show(d.staff, "list");
      } else throw new Error("bad response");
    })
    .catch(() => { if (box.dataset.state === "loading") { list.replaceChildren(); box.dataset.state = "error"; } });
})();
</script>
