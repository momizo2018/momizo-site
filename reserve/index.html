<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#140f0b">
<meta name="format-detection" content="telephone=no">
<title>揉蔵 | ご予約</title>
<meta name="description" content="揉蔵（もみぞう）のWEB予約。担当の決め方を選んで、コースと日時の予約へ進めます。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://drive.google.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&family=M+PLUS+1:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="../assets/icon/icon-192.png" sizes="192x192" type="image/png">
<link rel="icon" href="../assets/icon/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../assets/icon/apple-touch-icon.png">
<style>
/* 予約のトップページ。ウェブサイトの規格には従わない（色と書体だけ揉蔵にそろえる） */
:root {
  --ink: #f1e7d6; --muted: #d4c6b0; --soft: #bda98e; --faint: #a08c74;
  --accent: #c9a46c; --accent-hover: #dcb985; --on-accent: #211913;
  --night: #140f0b;
  --ink-08: rgba(241,231,214,.08); --ink-16: rgba(241,231,214,.16);
  --pad: 20px;
  --ease: cubic-bezier(.61, 1, .88, 1);
  --font: "Inter", "M PLUS 1", -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--night); -webkit-text-size-adjust: 100%; }
body {
  min-height: 100svh; color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.5; letter-spacing: .02em;
  font-feature-settings: "palt"; -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 12px; }
[hidden] { display: none !important; }

/* キービジュアルを奥に透かす（画面に固定） */
.kv { position: fixed; inset: 0; z-index: -1; background: url("../assets/img/key-sp.webp") center 20% / cover no-repeat; }
.kv::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,15,11,.62), rgba(20,15,11,.9) 55%, rgba(20,15,11,.96)); }
@media (min-aspect-ratio: 1/1) { .kv { background-image: url("../assets/img/key-2560.webp"); background-position: center 30%; } }

.page { width: min(100% - var(--pad) * 2, 560px); margin: 0 auto; padding-bottom: calc(28px + env(safe-area-inset-bottom)); }

/* ---------- 頭 ---------- */
.bar { display: flex; align-items: center; height: 64px; padding-top: env(safe-area-inset-top); }
.bar img { height: 32px; width: auto; display: block; }

/* ---------- タイトルとキャッチ ---------- */
.title { text-align: center; padding: 16px 0 20px; }
.title h1 { font-size: 32px; font-weight: 500; line-height: 1.3; letter-spacing: .08em; text-indent: .08em; }
.title p { margin-top: 10px; font-size: 18px; font-weight: 500; line-height: 1.5; letter-spacing: .08em; color: var(--accent-hover); }

/* ---------- 段の目印 ---------- */
.steps { display: flex; justify-content: center; gap: 20px; list-style: none; margin-bottom: 20px; font-size: 13px; color: var(--faint); }
.steps li { display: flex; align-items: center; gap: 6px; }
.steps b { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; box-shadow: inset 0 0 0 1px var(--faint); }
.steps .now { color: var(--ink); }
.steps .now b { background: var(--accent); color: var(--on-accent); box-shadow: none; }
.steps .done b { box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent); }

/* ---------- ガラスの箱と行 ---------- */
.box {
  padding: 8px 20px; border-radius: 24px;
  background: rgba(46,36,28,.56); box-shadow: inset 0 1px 0 var(--ink-16);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
}
.list { list-style: none; }
.list li + li { border-top: 1px solid var(--ink-08); }
.row { display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 14px 0; }
.row .face {
  flex: none; width: 48px; height: 48px; border-radius: 50%; overflow: hidden; align-self: flex-start;
  display: grid; place-items: center; background: var(--ink-08); color: var(--soft); font-size: 15px;
}
.row .face img { width: 100%; height: 100%; object-fit: cover; display: block; }
.row .text { flex: 1; min-width: 0; }
.row .top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.row .name { font-size: 17px; font-weight: 500; letter-spacing: .06em; }
.row .role { font-size: 13px; color: var(--soft); margin-left: 8px; letter-spacing: .04em; }
.row .fee { font-size: 13px; white-space: nowrap; color: var(--accent-hover); }
.row .fee.free { color: var(--soft); }
.row .meta { display: block; margin-top: 4px; font-size: 13px; line-height: 1.6; color: var(--soft); }
.row .arrow {
  flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  background: var(--ink-08); transition: background-color .2s var(--ease), color .2s var(--ease);
}
@media (hover: hover) { .row:hover .arrow { background: var(--accent); color: var(--on-accent); } }
.row:active { opacity: .7; }
.empty { padding: 20px 0; font-size: 14px; line-height: 1.7; color: var(--muted); }

/* ---------- 段の切り替え ---------- */
.view { animation: in .25s var(--ease); }
@keyframes in { from { opacity: 0; transform: translateY(6px); } }
.back { display: inline-flex; align-items: center; gap: 6px; margin-top: 16px; padding: 8px 0; font-size: 14px; color: var(--soft); }
@media (hover: hover) { .back:hover { color: var(--ink); } }

/* ---------- 下 ---------- */
.foot { margin-top: 20px; text-align: center; font-size: 13px; color: var(--soft); }
.foot a { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--faint); }

@media (prefers-reduced-motion: reduce) { .view { animation: none; } .row .arrow { transition: none; } }
</style>
</head>
<body>
<div class="kv" aria-hidden="true"></div>
<main class="page">
  <header class="bar">
    <a href="../" aria-label="揉蔵のサイトへ"><img src="../assets/logo/logo.png" alt="揉蔵" width="462" height="150"></a>
  </header>

  <div class="title">
    <h1>ご予約</h1>
    <p id="catch">まずは、担当の決め方から。</p>
  </div>

  <ol class="steps" id="steps" aria-label="ご予約の流れ">
    <li data-step="1"><b>1</b>決め方</li>
    <li data-step="2"><b>2</b>担当</li>
    <li data-step="3"><b>3</b>コースと日時</li>
  </ol>

  <!-- 1. 決め方 -->
  <section class="view" id="v-way" aria-label="担当の決め方">
    <div class="box">
      <ul class="list">
        <li><a class="row" id="go-any" href="">
          <span class="text">
            <span class="top"><span class="name">指定なし</span><span class="fee free">追加料金なし</span></span>
            <span class="meta">空いている担当が施術します。空きがいちばん多く、ご希望の日時で取りやすくなります。</span>
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        </a></li>
        <li id="way-gender"><a class="row" href="#gender">
          <span class="text">
            <span class="top"><span class="name">性別で指定</span><span class="fee">リクエスト料 ¥400</span></span>
            <span class="meta">男性・女性のどちらかを選べます。担当はお店で決めます。</span>
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        </a></li>
        <li id="way-staff"><a class="row" href="#staff">
          <span class="text">
            <span class="top"><span class="name">名前で指名</span><span class="fee">リクエスト料 ¥400</span></span>
            <span class="meta">いつもの担当や、気になるスタッフを選べます。</span>
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        </a></li>
      </ul>
    </div>
  </section>

  <!-- 2. 担当（性別） -->
  <section class="view" id="v-gender" aria-label="性別を選ぶ" hidden>
    <div class="box"><ul class="list" id="gender-list"></ul></div>
    <a class="back" href="#">← 決め方を選び直す</a>
  </section>

  <!-- 2. 担当（名前）：スタッフのシートから作る -->
  <section class="view" id="v-staff" aria-label="担当を選ぶ" hidden>
    <div class="box"><ul class="list" id="staff-list"><li class="empty">スタッフを読み込んでいます…</li></ul></div>
    <a class="back" href="#">← 決め方を選び直す</a>
  </section>

  <footer class="foot">
    <p>お電話でもご予約いただけます：<a href="tel:0287339178">0287-33-9178</a></p>
  </footer>
</main>

<script>
(() => {
  "use strict";

  /* ============================================================
     設定：予約の URL。Square の「高度なウィジェット」の「予約ボタンコード」の
     href="…" の中身を貼る。空にした性別は出さない。
     個人の URL は、スタッフのシートの「予約のURL」（H列）に貼る。
     ============================================================ */
  const URL_ANY = "https://app.squareup.com/appointments/book/tli4clkb20flxc/LZPVZXQ5CZ1A5/start";
  const URL_GENDER = { "男性": "", "女性": "" };
  const ENDPOINT = "https://script.google.com/macros/s/AKfycbymfb-1zaPmaks9vQk_cmBJg2P-YCuKZFA8bLx5pZIbiTHPu_sgtex6ePEetcoQa9Bh/exec?type=staff";
  const CACHE_KEY = "momizo-reserve-staff-1";
  const FEE = "リクエスト料 ¥400";
  const COURSES = ["ボディ", "ヘッド", "フット", "フル"];
  /* ============================================================ */

  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const okUrl = (u) => /^https:\/\/(app|book)\.squareup\.com\/appointments\/[\w\-\/]+$/.test(String(u || ""));
  const oneLine = (v) => String(v == null ? "" : v).replace(/\s+/g, " ").trim();

  $("go-any").href = URL_ANY;

  /* 1行を作る：face は写真のID（なければ頭文字） */
  function row(href, { name, role, fee, meta, face }) {
    const li = el("li");
    const a = el("a", "row"); a.href = href;
    if (face !== undefined) {
      const f = el("span", "face"); f.setAttribute("aria-hidden", "true");
      if (face.id) {
        const img = el("img"); img.alt = ""; img.width = 96; img.height = 96; img.decoding = "async"; img.referrerPolicy = "no-referrer";
        img.addEventListener("error", () => { img.remove(); f.textContent = face.initial; });
        img.src = "https://drive.google.com/thumbnail?id=" + face.id + "&sz=w160";
        f.append(img);
      } else f.textContent = face.initial;
      a.append(f);
    }
    const t = el("span", "text");
    const top = el("span", "top");
    const n = el("span", "name", name);
    if (role) n.append(el("span", "role", role));
    top.append(n, el("span", "fee", fee));
    t.append(top);
    if (meta) t.append(el("span", "meta", meta));
    const arrow = el("span", "arrow", "→"); arrow.setAttribute("aria-hidden", "true");
    a.append(t, arrow);
    li.append(a);
    return li;
  }

  /* スタッフの一覧から、性別と個人の行を作る。list が null なら読み込めなかった */
  function draw(list) {
    const staff = (list || []).map((p) => ({
      name: oneLine(p.name), role: oneLine(p.role), gender: oneLine(p.gender),
      courses: COURSES.filter((c) => String(p.courses || "").includes(c)).join("・"),
      photo: (String(p.photo || "").split(/\s+/).find((id) => /^[\w-]{20,}$/.test(id)) || ""),
      url: okUrl(p.reserve) ? p.reserve : "",
    })).filter((s) => s.name);

    // 性別：URL があり、その性別のスタッフがいるときだけ（読み込めないときは URL だけで決める）
    const g = $("gender-list"); g.replaceChildren();
    Object.entries(URL_GENDER).forEach(([sex, url]) => {
      if (!okUrl(url)) return;
      if (list && !staff.some((s) => s.gender === sex)) return;
      g.append(row(url, { name: sex + "スタッフ", fee: FEE, meta: sex + "の担当が施術します" }));
    });
    $("way-gender").hidden = !g.children.length;

    // 個人：予約のURLがある人だけ
    const s = $("staff-list"); s.replaceChildren();
    const named = staff.filter((p) => p.url);
    if (!list) {
      s.append(el("li", "empty", "スタッフの一覧を読み込めませんでした。時間をおいて開き直すか、お電話でご予約ください。"));
    } else {
      named.forEach((p) => s.append(row(p.url, {
        name: p.name, role: p.role, fee: "¥400", meta: p.courses ? "担当コース：" + p.courses : "",
        face: { id: p.photo, initial: p.name.charAt(0) },
      })));
    }
    $("way-staff").hidden = !!list && !named.length;
    show();
  }

  /* 読み込み：前回の一覧を先に出し、新しい一覧が来たら差し替える */
  let shown = null;
  const paint = (list) => { const sig = JSON.stringify(list); if (sig === shown) return; shown = sig; draw(list); };
  try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); if (Array.isArray(c)) paint(c); } catch (e) {}
  const ctrl = new AbortController();
  setTimeout(() => ctrl.abort(), 8000);
  fetch(ENDPOINT, { signal: ctrl.signal })
    .then((r) => r.json())
    .then((d) => {
      if (!d || !d.ok || !Array.isArray(d.staff)) throw new Error("bad response");
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(d.staff)); } catch (e) {}
      paint(d.staff);
    })
    .catch(() => { if (shown === null) { shown = "fail"; draw(null); } });

  /* 段の切り替え：#gender / #staff で2段目。スマホの戻るでも戻れる */
  const views = { "": "v-way", gender: "v-gender", staff: "v-staff" };
  const catches = { "": "まずは、担当の決め方から。", gender: "ご希望の性別を選んでください。", staff: "担当を選んでください。" };
  const steps = [...document.querySelectorAll("#steps li")];
  function show() {
    let k = location.hash.slice(1);
    if (!(k in views) || (k === "gender" && $("way-gender").hidden) || (k === "staff" && $("way-staff").hidden)) k = "";
    Object.entries(views).forEach(([h, id]) => { $(id).hidden = h !== k; });
    $("catch").textContent = catches[k];
    const now = k ? 2 : 1;
    steps.forEach((li) => {
      const n = +li.dataset.step;
      li.className = n === now ? "now" : n < now ? "done" : "";
      if (n === now) li.setAttribute("aria-current", "step"); else li.removeAttribute("aria-current");
    });
  }
  window.addEventListener("hashchange", show);
  document.querySelectorAll(".back").forEach((a) => a.addEventListener("click", (e) => {
    e.preventDefault();
    if (location.hash) history.back();
  }));
  show();
})();
</script>
</body>
</html>
