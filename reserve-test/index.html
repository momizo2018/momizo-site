<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#140f0b">
<title>埋め込みの試験 | 揉蔵</title>
<style>
/* 試験用のページ。どこからもリンクしない。試験が終わったら消す */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: #140f0b; -webkit-text-size-adjust: 100%; }
body { color: #f1e7d6; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; font-size: 15px; line-height: 1.6; }
a { color: inherit; }

.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 56px; padding: env(safe-area-inset-top) 16px 0; }
.bar img { height: 28px; width: auto; display: block; }
.bar nav { display: flex; gap: 12px; font-size: 13px; }
.bar nav a { color: #bda98e; }
.bar nav a[aria-current] { color: #dcb985; font-weight: 600; text-decoration: none; }

/* 選択中の帯 */
.picked { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; border-top: 1px solid rgba(241,231,214,.08); border-bottom: 1px solid rgba(241,231,214,.08); font-size: 14px; }
.picked b { color: #dcb985; font-weight: 600; }
.picked a { color: #bda98e; font-size: 13px; }

/* 試験の記録（何px の枠になったか） */
.probe { padding: 6px 16px; font-size: 12px; color: #a08c74; }

/* 埋め込む枠：画面の幅いっぱい、白地 */
.frame { width: 100%; background: #fff; color: #1a1a1a; min-height: 200px; }
.frame iframe { display: block; width: 100%; border: 0; }
.b-frame { height: 80svh; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header class="bar">
  <img src="../assets/logo/logo.png" alt="揉蔵" width="462" height="150">
  <nav aria-label="試し方">
    <a href="#a" id="tab-a">A：埋め込みコード</a>
    <a href="#b" id="tab-b">B：URLを枠で</a>
  </nav>
</header>

<div class="picked"><span>選択中：<b>テスト（大金 慶）</b></span><a href="#">変更する</a></div>
<p class="probe" id="probe">枠の高さ：測定中…</p>

<!-- A：Square の「ウィジェットコード」をそのまま置く -->
<section class="frame" id="sec-a">
<!-- Start Square Appointments Embed Code --><script src='https://app.squareup.com/appointments/buyer/widget/3l7utu3390we3a/LZPVZXQ5CZ1A5.js'></script><!-- End Square Appointments Embed Code -->
</section>

<!-- B：単独の URL を、こちらで作った枠で開く（高さは画面の8割で固定） -->
<section class="frame" id="sec-b" hidden>
  <iframe class="b-frame" title="Square 予約" data-src="https://app.squareup.com/appointments/buyer/widget/3l7utu3390we3a/LZPVZXQ5CZ1A5"></iframe>
</section>

<script>
(() => {
  "use strict";
  const a = document.getElementById("sec-a"), b = document.getElementById("sec-b");
  const bf = b.querySelector("iframe");
  const probe = document.getElementById("probe");
  function show() {
    const isB = location.hash === "#b";
    a.hidden = isB; b.hidden = !isB;
    document.getElementById("tab-a").toggleAttribute("aria-current", !isB);
    document.getElementById("tab-b").toggleAttribute("aria-current", isB);
    if (isB && !bf.src) bf.src = bf.dataset.src;
  }
  window.addEventListener("hashchange", show);
  show();
  // 枠の高さを1秒ごとに記録する（中身に合わせて伸びるかを見る）
  setInterval(() => {
    const f = (location.hash === "#b" ? b : a).querySelector("iframe");
    probe.textContent = f ? `枠の高さ：${Math.round(f.getBoundingClientRect().height)}px（画面の高さ ${innerHeight}px）` : "枠の高さ：枠がまだできていません";
  }, 1000);
})();
</script>
</body>
</html>
