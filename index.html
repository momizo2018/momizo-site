<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f4f2ed">
<meta name="format-detection" content="telephone=no">
<title>揉蔵 | ご予約</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --ink: #171716;
  --muted: #77736c;
  --soft: #a19c94;
  --line: rgba(23,23,22,.10);
  --paper: #f4f2ed;
  --card: rgba(255,254,251,.88);
  --accent: #a28d73;
  --accent-light: rgba(162,141,115,.13);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  min-height: 100%;
  background: var(--paper);
}

body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 18px;
  color: var(--ink);
  font-family: "Inter", "Noto Sans JP", -apple-system, BlinkMacSystemFont,
    "Hiragino Sans", "Yu Gothic", sans-serif;
  background:
    radial-gradient(circle at 8% 8%, rgba(255,255,255,.95), transparent 34%),
    radial-gradient(circle at 94% 92%, rgba(206,195,180,.30), transparent 32%),
    linear-gradient(145deg, #faf9f6 0%, #eeece7 100%);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  width: 460px;
  height: 460px;
  top: -290px;
  left: -260px;
  border: 1px solid rgba(162,141,115,.16);
  border-radius: 50%;
  pointer-events: none;
}

.card {
  position: relative;
  width: min(100%, 430px);
  padding: 30px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,.85);
  border-radius: 25px;
  background: var(--card);
  box-shadow:
    0 24px 60px rgba(40,34,27,.115),
    0 2px 8px rgba(40,34,27,.035);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  animation: enter .65s cubic-bezier(.16,1,.3,1) both;
}

.card::after {
  content: "";
  position: absolute;
  width: 190px;
  height: 190px;
  right: -125px;
  top: -115px;
  border-radius: 50%;
  background: rgba(162,141,115,.08);
  pointer-events: none;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 23px;
  border-bottom: 1px solid var(--line);
}

.brand {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.brand-name {
  font-size: 25px;
  line-height: 1;
  font-weight: 700;
  letter-spacing: -.065em;
}

.brand-sub {
  color: var(--soft);
  font-size: 8px;
  line-height: 1;
  font-weight: 600;
  letter-spacing: .23em;
  text-transform: uppercase;
}

.mark {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(162,141,115,.24);
  border-radius: 50%;
  color: var(--accent);
  background: var(--accent-light);
  font-size: 10px;
  font-weight: 600;
}

.main {
  padding: 45px 0 39px;
  text-align: left;
}

.kicker {
  margin-bottom: 13px;
  color: var(--accent);
  font-size: 9px;
  line-height: 1;
  font-weight: 700;
  letter-spacing: .25em;
}

.title {
  max-width: 100%;
  font-size: clamp(27px, 7.3vw, 37px);
  line-height: 1.28;
  font-weight: 600;
  letter-spacing: -.045em;
  word-break: keep-all;
  overflow-wrap: normal;
  text-wrap: balance;
}

.title-accent {
  color: var(--accent);
}

.description {
  margin-top: 18px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.95;
  letter-spacing: .025em;
}

.actions {
  display: grid;
  gap: 10px;
}

.reserve,
.line {
  width: 100%;
  min-height: 58px;
  display: flex;
  align-items: center;
  text-decoration: none;
  border-radius: 14px;
  transition: none;
}

.reserve {
  justify-content: space-between;
  padding: 0 17px 0 21px;
  color: #fff;
  background:
    linear-gradient(180deg, #1b1b1a 0%, #151514 100%);
  box-shadow:
    0 12px 25px rgba(23,23,22,.15),
    inset 0 1px 0 rgba(255,255,255,.06);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .04em;
}

.reserve-arrow,
.line-arrow {
  width: 29px;
  height: 29px;
  display: grid;
  place-items: center;
  flex: 0 0 29px;
  border-radius: 50%;
  font-size: 13px;
  transition: transform .22s ease;
}

.reserve-arrow {
  border: 1px solid rgba(255,255,255,.20);
}

.reserve:hover {
  background: #242423;
  transform: translateY(-2px);
  box-shadow:
    0 16px 30px rgba(23,23,22,.18),
    inset 0 1px 0 rgba(255,255,255,.07);
}

.reserve:hover .reserve-arrow {
  transform: translateX(3px);
}

.line {
  justify-content: space-between;
  padding: 0 17px 0 21px;
  color: #45423d;
  background: rgba(255,255,255,.20);
  border: 1px solid rgba(23,23,22,.12);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .04em;
}

.line-arrow {
  border: 1px solid rgba(23,23,22,.10);
}

.line:hover {
  background: rgba(255,255,255,.75);
  border-color: rgba(23,23,22,.20);
  transform: translateY(-1px);
}

.line:hover .line-arrow {
  transform: translate(2px,-2px);
}

.mark {
  transition: transform .25s ease, background .25s ease;
}

.card:hover .mark {
  transform: rotate(-4deg);
  background: rgba(162,141,115,.17);
}

.footer {
  margin-top: 25px;
  text-align: center;
  color: #aaa49b;
  font-size: 8px;
  font-weight: 500;
  letter-spacing: .17em;
  text-transform: uppercase;
}

#overlay {
  display: none;
}

@keyframes enter {
  from {
    opacity: 0;
    transform: translateY(12px) scale(.988);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes fadeOut {
  from { opacity: 0; }
  to { opacity: 1; }
}

@media (max-width: 480px) {
  body {
    padding: 12px;
  }

  .card {
    padding: 25px 21px 22px;
    border-radius: 22px;
  }

  .main {
    padding: 38px 0 34px;
  }

  .title {
    font-size: clamp(25px, 7.5vw, 32px);
    line-height: 1.3;
    letter-spacing: -.035em;
  }

  .description {
    font-size: 11.5px;
  }
}

@media (max-width: 360px) {
  .card {
    padding-left: 18px;
    padding-right: 18px;
  }

  .title {
    font-size: 24px;
    letter-spacing: -.02em;
  }

  .brand-name {
    font-size: 23px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>
  <div id="overlay" aria-hidden="true"></div>

  <main class="card">
    <header class="header">
      <div class="brand">
        <div class="brand-name">momizo</div>
        <div class="brand-sub">Relaxation &amp; Care</div>
      </div>
      <div class="mark" aria-hidden="true">m</div>
    </header>

    <section class="main">
      <div class="kicker">RESERVATION</div>
      <h1 class="title">
        心地よい時間を、<br>
        <span class="title-accent">あなたのために。</span>
      </h1>
      <p class="description">
        ご予約はWEBから承っております。<br>
        担当者・メニュー・ご希望の時間を選択して、<br>ご予約へお進みください。
      </p>
    </section>

    <nav class="actions" aria-label="ご案内">
      <a href="#" class="reserve" id="reserve-btn">
        <span>WEB予約</span>
        <span class="reserve-arrow" aria-hidden="true">→</span>
      </a>

      <a href="https://page.line.me/cvj7583f" class="line">
        <span>公式LINE</span>
        <span class="line-arrow" aria-hidden="true">↗</span>
      </a>
    </nav>

    <footer class="footer">Take a moment for yourself</footer>
  </main>

<script>
(() => {
  const reserveBtn = document.getElementById("reserve-btn");

  const targetUrl =
    "https://app.squareup.com/appointments/book/tli4clkb20flxc/LZPVZXQ5CZ1A5/start";

  let transitioning = false;

  function goToReservation(event) {
    if (event) event.preventDefault();
    if (transitioning) return;

    transitioning = true;
    reserveBtn.style.pointerEvents = "none";
    window.location.replace(targetUrl);
  }

  reserveBtn.addEventListener("click", goToReservation);

  window.addEventListener("pageshow", (event) => {
    if (event.persisted) {
      transitioning = false;
    }
  });
})();
</script>
</body>
</html>
